<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Order Format Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f0f0f0; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; background: #007acc; color: white; }
        button:hover { background: #005a9e; }
        .success { color: green; background: #e8f5e8; padding: 10px; border-radius: 4px; margin: 10px 0; }
        .error { color: red; background: #ffebee; padding: 10px; border-radius: 4px; margin: 10px 0; }
        .info { color: blue; background: #e3f2fd; padding: 10px; border-radius: 4px; margin: 10px 0; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
        .output { min-height: 100px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Complete Hyperliquid Order Format Test</h1>
        
        <div class="section">
            <h3>1. Asset Mapping</h3>
            <div id="asset-output" class="output">Click to load asset mapping...</div>
            <button onclick="loadAssetMapping()">Load Asset Mapping</button>
        </div>
        
        <div class="section">
            <h3>2. Wallet Setup</h3>
            <div id="wallet-output" class="output">Click to setup wallet...</div>
            <button onclick="setupRealWallet()">Setup Real Wallet</button>
            <button onclick="setupTestWallet()">Setup Test Wallet</button>
        </div>
        
        <div class="section">
            <h3>3. Order Format Test</h3>
            <div id="format-output" class="output">Click to test order format...</div>
            <button onclick="testOrderFormat()">Test Order Format</button>
        </div>
        
        <div class="section">
            <h3>4. API Call Test</h3>
            <div id="api-output" class="output">Click to test API call...</div>
            <button onclick="testApiCall()">Test API Call</button>
        </div>
        
        <div class="section">
            <h3>5. Service Integration Test</h3>
            <div id="service-output" class="output">Click to test service integration...</div>
            <button onclick="testServiceIntegration()">Test Service Integration</button>
        </div>
    </div>

    <script>
        let currentWallet = null;
        let assetMapping = {};
        
        function updateOutput(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            
            let content = '';
            if (typeof message === 'object') {
                content = `<pre>${JSON.stringify(message, null, 2)}</pre>`;
            } else {
                content = `<div class="${className}">${message}</div>`;
            }
            
            element.innerHTML = content;
        }
        
        async function loadAssetMapping() {
            updateOutput('asset-output', 'Loading asset mapping...');
            
            try {
                const response = await fetch('https://api.hyperliquid.xyz/info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'meta' })
                });
                
                const meta = await response.json();
                
                if (meta.universe) {
                    // Create asset mapping
                    meta.universe.forEach((asset, index) => {
                        assetMapping[asset.name] = index;
                    });
                    
                    const ethIndex = assetMapping['ETH'];
                    const output = {
                        totalAssets: meta.universe.length,
                        ethIndex: ethIndex,
                        ethInfo: meta.universe[ethIndex],
                        allAssets: meta.universe.map((item, index) => ({
                            index,
                            name: item.name,
                            szDecimals: item.szDecimals
                        }))
                    };
                    
                    updateOutput('asset-output', output, 'success');
                } else {
                    updateOutput('asset-output', 'No universe data found', 'error');
                }
            } catch (error) {
                updateOutput('asset-output', `Error: ${error.message}`, 'error');
            }
        }
        
        async function setupRealWallet() {
            updateOutput('wallet-output', 'Setting up real wallet...');
            
            if (window.hyperliquidService && window.hyperliquidService.wallet) {
                currentWallet = window.hyperliquidService.wallet;
                updateOutput('wallet-output', `Real wallet connected: ${currentWallet.address}`, 'success');
            } else {
                updateOutput('wallet-output', 'No real wallet available in service', 'error');
            }
        }
        
        async function setupTestWallet() {
            updateOutput('wallet-output', 'Setting up test wallet...');
            
            // Create a simple test wallet
            currentWallet = {
                address: '0x9B7692dBb4b5524353ABE6826CE894Bcc235b7fB',
                signMessage: async (message) => {
                    // Return a mock signature for testing
                    return '0x' + '0'.repeat(130);
                }
            };
            
            updateOutput('wallet-output', `Test wallet created: ${currentWallet.address}`, 'success');
        }
        
        async function testOrderFormat() {
            if (!currentWallet) {
                updateOutput('format-output', 'Please setup a wallet first', 'error');
                return;
            }
            
            updateOutput('format-output', 'Testing order format...');
            
            try {
                const ethAssetId = assetMapping['ETH'] || 0;
                
                const order = {
                    a: ethAssetId,
                    b: true,
                    p: "1000000",
                    s: "0.001",
                    r: false,
                    t: { limit: { tif: 'Ioc' } },
                    c: null
                };
                
                const action = {
                    type: 'order',
                    orders: [order]
                };
                
                // Test signing
                const message = JSON.stringify(action);
                const signature = await currentWallet.signMessage(message);
                
                const output = {
                    ethAssetId: ethAssetId,
                    order: order,
                    action: action,
                    message: message,
                    signature: signature
                };
                
                updateOutput('format-output', output, 'success');
                
            } catch (error) {
                updateOutput('format-output', `Error: ${error.message}`, 'error');
            }
        }
        
        async function testApiCall() {
            if (!currentWallet) {
                updateOutput('api-output', 'Please setup a wallet first', 'error');
                return;
            }
            
            updateOutput('api-output', 'Testing API call...');
            
            try {
                const ethAssetId = assetMapping['ETH'] || 0;
                const nonce = Date.now();
                
                const order = {
                    a: ethAssetId,
                    b: true,
                    p: "1000000",
                    s: "0.001",
                    r: false,
                    t: { limit: { tif: 'Ioc' } },
                    c: null
                };
                
                const action = {
                    type: 'order',
                    orders: [order]
                };
                
                const signature = await currentWallet.signMessage(JSON.stringify(action));
                
                const requestBody = {
                    action,
                    nonce,
                    signature
                };
                
                const response = await fetch('https://api.hyperliquid.xyz/exchange', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                
                const responseText = await response.text();
                
                const output = {
                    requestBody: requestBody,
                    responseStatus: response.status,
                    responseText: responseText
                };
                
                try {
                    output.responseJson = JSON.parse(responseText);
                } catch (e) {
                    output.parseError = e.message;
                }
                
                updateOutput('api-output', output, response.ok ? 'success' : 'error');
                
            } catch (error) {
                updateOutput('api-output', `Error: ${error.message}`, 'error');
            }
        }
        
        async function testServiceIntegration() {
            updateOutput('service-output', 'Testing service integration...');
            
            if (!window.hyperliquidService) {
                updateOutput('service-output', 'Service not available', 'error');
                return;
            }
            
            try {
                const service = window.hyperliquidService;
                
                // Test account info
                const accountInfo = await service.getAccountInfo();
                
                // Test order placement
                const orderResult = await service.placeMarketOrder('ETH', 'buy', 0.001);
                
                const output = {
                    hasWallet: !!service.wallet,
                    walletAddress: service.wallet?.address,
                    accountInfo: accountInfo,
                    orderResult: orderResult
                };
                
                updateOutput('service-output', output, 'success');
                
            } catch (error) {
                updateOutput('service-output', `Error: ${error.message}`, 'error');
            }
        }
        
        // Auto-load asset mapping on page load
        window.addEventListener('load', () => {
            setTimeout(loadAssetMapping, 1000);
        });
    </script>
</body>
</html>

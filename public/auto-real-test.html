<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Real Data Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0a0e13;
            color: white;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 20px;
            background-color: #181C29;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .success { background-color: rgba(0,255,76,0.2); border-left: 4px solid #00FF4B; }
        .error { background-color: rgba(255,56,56,0.2); border-left: 4px solid #FF3838; }
        .warning { background-color: rgba(240,185,11,0.2); border-left: 4px solid #FFC200; }
        .info { background-color: rgba(59,130,246,0.2); border-left: 4px solid #3B82F6; }
        .data {
            background-color: #0F1419;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin: 10px 0;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
        }
        .loading {
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }
        button {
            background-color: rgba(0,255,76,0.80);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Automatic Real Data Test</h1>
            <p>Testing your Hyperliquid account with the provided keys</p>
            <p><strong>Expected Balance: $17.50</strong></p>
        </div>

        <div id="status" class="status info">
            <div class="loading">🔄 Initializing...</div>
        </div>

        <div id="results" style="display:none;">
            <h2>📊 Real Account Data</h2>
            <div id="accountData" class="data"></div>
            
            <h2>📈 Positions Data</h2>
            <div id="positionsData" class="data"></div>
            
            <h2>📋 Orders Data</h2>
            <div id="ordersData" class="data"></div>
            
            <h2>💱 Market Data</h2>
            <div id="marketData" class="data"></div>
        </div>

        <div style="margin-top: 20px;">
            <button onclick="runTest()">🔄 Re-run Test</button>
            <button onclick="openMainApp()">🏠 Open Main App</button>
            <button onclick="openConsole()">🔧 Open Console</button>
        </div>
    </div>

    <script>
        // Your keys
        const PRIVATE_KEY = '0x671df21eaff14e1bc928c3f9d9fa8fcc6fb33e7b70659b59c1cf6ff6c09a9a30';
        const PUBLIC_KEY = '0x9B7692dBb4b5524353ABE6826CE894Bcc235b7fB';
        const EXPECTED_BALANCE = 17.50;

        let testResults = null;

        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.className = `status ${type}`;
            statusEl.innerHTML = message;
        }

        function showResults(data) {
            document.getElementById('results').style.display = 'block';
            
            if (data.accountInfo) {
                document.getElementById('accountData').textContent = 
                    `Balance: $${data.balance.toFixed(2)}\n` +
                    `PnL: $${data.pnl.toFixed(2)}\n` +
                    `Raw Account Data:\n${JSON.stringify(data.accountInfo, null, 2)}`;
            }
            
            if (data.positionsData) {
                document.getElementById('positionsData').textContent = 
                    data.positionsData.length > 0 ? 
                    JSON.stringify(data.positionsData, null, 2) : 
                    'No positions found';
            }
            
            if (data.ordersData) {
                document.getElementById('ordersData').textContent = 
                    data.ordersData.length > 0 ? 
                    JSON.stringify(data.ordersData, null, 2) : 
                    'No orders found';
            }
            
            if (data.marketData) {
                document.getElementById('marketData').textContent = 
                    JSON.stringify(data.marketData, null, 2);
            }
        }

        async function runRealDataTest() {
            try {
                updateStatus('🔍 Looking for Hyperliquid service...', 'info');
                
                // Try to get service from main app window
                let service = null;
                
                if (window.hyperliquidService) {
                    service = window.hyperliquidService;
                } else if (window.opener && window.opener.hyperliquidService) {
                    service = window.opener.hyperliquidService;
                } else {
                    // Try to load from iframe or create connection to main app
                    const mainAppFrame = document.createElement('iframe');
                    mainAppFrame.src = '/';
                    mainAppFrame.style.display = 'none';
                    document.body.appendChild(mainAppFrame);
                    
                    await new Promise(resolve => setTimeout(resolve, 3000)); // Wait for load
                    
                    if (mainAppFrame.contentWindow && mainAppFrame.contentWindow.hyperliquidService) {
                        service = mainAppFrame.contentWindow.hyperliquidService;
                    }
                }

                if (!service) {
                    throw new Error('Hyperliquid service not found. Please open the main app first.');
                }

                updateStatus('🔑 Connecting with your private key...', 'warning');

                // Connect with your actual private key
                const connected = await service.connect(PRIVATE_KEY);
                
                if (!connected) {
                    throw new Error('Failed to connect with provided private key');
                }

                const walletAddress = service.getWalletAddress();
                updateStatus(`✅ Connected! Wallet: ${walletAddress}`, 'success');

                // Verify address match
                const addressMatch = walletAddress?.toLowerCase() === PUBLIC_KEY.toLowerCase();
                console.log('Address match:', addressMatch);

                updateStatus('💰 Fetching real account data...', 'warning');

                // Fetch all data
                const [accountInfo, positions, orders, marketData] = await Promise.all([
                    service.getAccountInfo(),
                    service.getPositions(),
                    service.getOpenOrders(),
                    service.getMarketData('ETH').catch(() => ({}))
                ]);

                const balance = parseFloat(accountInfo.marginSummary.accountValue);
                const pnl = parseFloat(accountInfo.marginSummary.totalNtlPos);

                // Check if balance matches expected
                const balanceMatch = Math.abs(balance - EXPECTED_BALANCE) < 0.01;

                testResults = {
                    connected: true,
                    walletAddress,
                    balance,
                    pnl,
                    positions: positions.length,
                    orders: orders.length,
                    accountInfo,
                    positionsData: positions,
                    ordersData: orders,
                    marketData,
                    balanceMatch
                };

                let statusMessage = `🎉 Real data fetched successfully!\n`;
                statusMessage += `💰 Balance: $${balance.toFixed(2)} ${balanceMatch ? '✅' : '⚠️'}\n`;
                statusMessage += `📊 Positions: ${positions.length}\n`;
                statusMessage += `📋 Orders: ${orders.length}\n`;
                statusMessage += `🔗 Address: ${walletAddress}`;

                updateStatus(statusMessage, 'success');
                showResults(testResults);

                if (balanceMatch) {
                    console.log('🎯 SUCCESS: Balance matches expected $17.50!');
                } else {
                    console.log(`⚠️ Balance is $${balance.toFixed(2)}, expected $${EXPECTED_BALANCE}`);
                }

                return testResults;

            } catch (error) {
                updateStatus(`❌ Test failed: ${error.message}`, 'error');
                console.error('Real data test error:', error);
                return null;
            }
        }

        function runTest() {
            runRealDataTest();
        }

        function openMainApp() {
            window.open('/', '_blank');
        }

        function openConsole() {
            updateStatus('💡 Open browser console (F12) to see detailed logs', 'info');
        }

        // Auto-run test when page loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('🚀 Auto-running real data test...');
                runRealDataTest();
            }, 1000);
        });

        // Make test results available globally
        window.getTestResults = () => testResults;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Debug Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        button { padding: 10px; margin: 10px; }
        .output { background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .error { color: red; }
        pre { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Hyperliquid API Debug Test</h1>
    
    <button onclick="setupWallet()">1. Setup Test Wallet</button>
    <button onclick="testOrderFormat()">2. Test Order Format</button>
    <button onclick="makeApiCall()">3. Make API Call</button>
    
    <div id="output" class="output"></div>
    
    <script>
        let testWallet = null;
        
        function log(message, isError = false) {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.className = isError ? 'error' : '';
            div.innerHTML = '<pre>' + (typeof message === 'object' ? JSON.stringify(message, null, 2) : message) + '</pre>';
            output.appendChild(div);
        }
        
        async function setupWallet() {
            log('Setting up test wallet...');
            
            try {
                // Use the existing wallet setup
                const privateKey = "0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef";
                const wallet = new ethers.Wallet(privateKey);
                
                testWallet = {
                    address: wallet.address,
                    signMessage: async (message) => {
                        return await wallet.signMessage(message);
                    }
                };
                
                log('Test wallet created: ' + testWallet.address);
                
            } catch (error) {
                log('Error setting up wallet: ' + error.message, true);
            }
        }
        
        async function testOrderFormat() {
            if (!testWallet) {
                log('Please setup wallet first', true);
                return;
            }
            
            log('Testing order format...');
            
            const order = {
                a: 0, // asset
                b: true, // is_buy
                p: "1000000", // price
                s: "0.001", // size
                r: false, // reduce_only
                t: { limit: { tif: 'Ioc' } }, // order type
                c: null // client order id
            };

            const action = {
                type: 'order',
                orders: [order]
            };
            
            log('Order format:');
            log(action);
            
            try {
                // Test signature
                const message = JSON.stringify(action);
                const messageBytes = ethers.toUtf8Bytes(message);
                const messageHash = ethers.keccak256(messageBytes);
                
                const signature = await testWallet.signMessage(ethers.getBytes(messageHash));
                const sig = ethers.Signature.from(signature);
                
                const sigObject = {
                    r: sig.r,
                    s: sig.s,
                    v: sig.v
                };
                
                log('Signature created:');
                log(sigObject);
                
            } catch (error) {
                log('Error creating signature: ' + error.message, true);
            }
        }
        
        async function makeApiCall() {
            if (!testWallet) {
                log('Please setup wallet first', true);
                return;
            }
            
            log('Making API call...');
            
            try {
                const nonce = Date.now();
                
                const order = {
                    a: 0, // asset
                    b: true, // is_buy
                    p: "1000000", // price
                    s: "0.001", // size
                    r: false, // reduce_only
                    t: { limit: { tif: 'Ioc' } }, // order type
                    c: null // client order id
                };

                const action = {
                    type: 'order',
                    orders: [order]
                };
                
                // Create signature
                const message = JSON.stringify(action);
                const messageBytes = ethers.toUtf8Bytes(message);
                const messageHash = ethers.keccak256(messageBytes);
                
                const signature = await testWallet.signMessage(ethers.getBytes(messageHash));
                const sig = ethers.Signature.from(signature);
                
                const requestBody = {
                    action,
                    nonce,
                    signature: {
                        r: sig.r,
                        s: sig.s,
                        v: sig.v
                    }
                };
                
                log('Request body:');
                log(requestBody);
                
                const response = await fetch('https://api.hyperliquid.xyz/exchange', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });
                
                log('Response status: ' + response.status);
                
                const responseText = await response.text();
                log('Raw response: ' + responseText);
                
                try {
                    const responseJson = JSON.parse(responseText);
                    log('Parsed response:');
                    log(responseJson);
                } catch (parseError) {
                    log('Could not parse as JSON: ' + parseError.message, true);
                }
                
            } catch (error) {
                log('API call error: ' + error.message, true);
            }
        }
    </script>
    
    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
</body>
</html>

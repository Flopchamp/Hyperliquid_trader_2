<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Address Verification Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0a0e13;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .section {
            margin-bottom: 20px;
            padding: 20px;
            background-color: #23272E;
            border-radius: 8px;
        }
        .code {
            background-color: #0F1419;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin: 10px 0;
            word-break: break-all;
        }
        .result {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success { background-color: rgba(0,255,76,0.2); }
        .error { background-color: rgba(255,56,56,0.2); }
        .warning { background-color: rgba(240,185,11,0.2); }
        button {
            background-color: rgba(0,255,76,0.80);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background-color: #0F1419;
            color: white;
            border: 1px solid #374151;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section">
            <h1>🔑 Key Address Verification Test</h1>
            <p>This will help us understand why the address verification is failing.</p>
        </div>

        <div class="section">
            <h2>📋 Your Keys</h2>
            <div>
                <label>Public Key (Address):</label>
                <input type="text" id="publicKey" value="0x9B7692dBb4b5524353ABE6826CE894Bcc235b7fB" />
            </div>
            <div>
                <label>Private Key:</label>
                <input type="password" id="privateKey" value="0x671df21eaff14e1bc928c3f9d9fa8fcc6fb33e7b70659b59c1cf6ff6c09a9a30" />
            </div>
            <button onclick="verifyKeys()">Verify Key Correspondence</button>
        </div>

        <div class="section">
            <h2>📊 Verification Results</h2>
            <div id="results"></div>
        </div>

        <div class="section">
            <h2>🔧 Fix Implementation</h2>
            <p>Based on the results above, we'll fix the verification logic.</p>
            <button onclick="fixVerification()">Apply Fix</button>
            <div id="fixStatus"></div>
        </div>
    </div>

    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
    <script>
        async function verifyKeys() {
            const publicKey = document.getElementById('publicKey').value;
            const privateKey = document.getElementById('privateKey').value;
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = '<p>Verifying keys...</p>';
            
            try {
                // Create wallet from private key
                const wallet = new ethers.Wallet(privateKey);
                const derivedAddress = wallet.address;
                
                // Compare addresses
                const providedAddress = publicKey;
                const normalizedProvided = ethers.utils.getAddress(providedAddress.toLowerCase());
                const normalizedDerived = ethers.utils.getAddress(derivedAddress.toLowerCase());
                
                const match = normalizedProvided === normalizedDerived;
                const caseMatch = providedAddress === derivedAddress;
                
                resultsDiv.innerHTML = `
                    <div class="result">
                        <h3>🔍 Address Comparison</h3>
                        <div class="code">
                            <div><strong>Provided Public Key:</strong> ${providedAddress}</div>
                            <div><strong>Derived from Private Key:</strong> ${derivedAddress}</div>
                        </div>
                    </div>
                    
                    <div class="result">
                        <h3>📏 Normalized Comparison</h3>
                        <div class="code">
                            <div><strong>Normalized Provided:</strong> ${normalizedProvided}</div>
                            <div><strong>Normalized Derived:</strong> ${normalizedDerived}</div>
                        </div>
                    </div>
                    
                    <div class="result ${match ? 'success' : 'error'}">
                        <h3>✅ Verification Result</h3>
                        <p><strong>Addresses Match (normalized):</strong> ${match ? '✓ YES' : '✗ NO'}</p>
                        <p><strong>Exact Case Match:</strong> ${caseMatch ? '✓ YES' : '✗ NO'}</p>
                    </div>
                    
                    <div class="result warning">
                        <h3>🔧 Issue Analysis</h3>
                        <p>${match ? 
                            'The addresses match when normalized! The issue is likely case sensitivity in the verification logic.' : 
                            'The addresses do not match! There may be an issue with the private key or address derivation.'
                        }</p>
                    </div>
                `;
                
                // Test the current verification logic
                const currentLogicMatch = derivedAddress.toLowerCase() === providedAddress.toLowerCase();
                
                resultsDiv.innerHTML += `
                    <div class="result ${currentLogicMatch ? 'success' : 'error'}">
                        <h3>🧪 Current Logic Test</h3>
                        <p><strong>Current verification (toLowerCase):</strong> ${currentLogicMatch ? '✓ PASS' : '✗ FAIL'}</p>
                        <div class="code">
                            derivedAddress.toLowerCase() === providedAddress.toLowerCase()<br>
                            "${derivedAddress.toLowerCase()}" === "${providedAddress.toLowerCase()}"
                        </div>
                    </div>
                `;
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Error</h3>
                        <p>Failed to verify keys: ${error.message}</p>
                    </div>
                `;
            }
        }

        function fixVerification() {
            const fixStatus = document.getElementById('fixStatus');
            fixStatus.innerHTML = `
                <div class="result warning">
                    <h3>🔧 Recommended Fix</h3>
                    <p>The issue is likely in the verification logic. Here's what we need to change:</p>
                    <div class="code">
// Current problematic logic:
if (walletAddress && walletAddress.toLowerCase() !== publicKey.toLowerCase()) {
    // This might fail due to checksum differences
}

// Better logic using ethers utils:
const normalizedWallet = ethers.utils.getAddress(walletAddress);
const normalizedPublic = ethers.utils.getAddress(publicKey);
if (normalizedWallet !== normalizedPublic) {
    // This properly handles address normalization
}

// Or simply remove the verification entirely since:
// 1. The private key is the source of truth
// 2. The public key is just for user reference
// 3. If they don't match, it's user error but shouldn't block connection
                    </div>
                    <p><strong>Recommendation:</strong> Remove or simplify the verification to avoid blocking valid connections.</p>
                </div>
            `;
        }

        // Auto-run verification on page load
        window.onload = function() {
            setTimeout(verifyKeys, 500);
        };
    </script>
</body>
</html>

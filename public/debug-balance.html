<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #1a1a1a;
            color: #fff;
        }
        .container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #005999;
        }
        .result {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
        }
        .error {
            color: #ff6b6b;
        }
        .success {
            color: #51cf66;
        }
        input {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 Balance Debug Test</h1>
    
    <div class="container">
        <h3>Debug Account Balance Issue</h3>
        <p>This will help us figure out why the balance shows $0 instead of $17.50</p>
        
        <div>
            <label>Private Key:</label>
            <input type="password" id="privateKey" placeholder="Enter your private key">
        </div>
        
        <button onclick="debugBalance()">🔍 Debug Balance</button>
        <button onclick="testRawAPI()">🌐 Test Raw API</button>
        <button onclick="clearResults()">🧹 Clear</button>
        
        <div id="results" class="result"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.7.1/dist/ethers.umd.min.js"></script>
    <script>
        let results = document.getElementById('results');
        
        function log(message, isError = false) {
            const timestamp = new Date().toLocaleTimeString();
            const className = isError ? 'error' : 'success';
            results.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            results.scrollTop = results.scrollHeight;
        }
        
        function clearResults() {
            results.innerHTML = '';
        }
        
        async function debugBalance() {
            const privateKey = document.getElementById('privateKey').value;
            
            if (!privateKey) {
                log('❌ Please enter your private key', true);
                return;
            }
            
            try {
                log('🔍 Starting balance debug...');
                
                // Create wallet
                const wallet = new ethers.Wallet(privateKey);
                log(`✅ Wallet created: ${wallet.address}`);
                
                // Test account info API call
                log('📡 Fetching account info...');
                const response = await fetch('https://api.hyperliquid.xyz/info', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        type: 'clearinghouseState',
                        user: wallet.address
                    })
                });
                
                if (!response.ok) {
                    log(`❌ HTTP error: ${response.status} ${response.statusText}`, true);
                    return;
                }
                
                const accountInfo = await response.json();
                log('✅ Raw API Response:');
                log(JSON.stringify(accountInfo, null, 2));
                
                // Parse balance values
                if (accountInfo && accountInfo.marginSummary) {
                    const accountValue = accountInfo.marginSummary.accountValue;
                    const totalRawUsd = accountInfo.marginSummary.totalRawUsd;
                    const withdrawable = accountInfo.withdrawable;
                    const crossMarginUsed = accountInfo.crossMarginUsed;
                    
                    log('\n💰 Balance Analysis:');
                    log(`Account Value (raw): ${accountValue}`);
                    log(`Account Value (parsed): ${parseFloat(accountValue)}`);
                    log(`Total Raw USD: ${totalRawUsd}`);
                    log(`Withdrawable: ${withdrawable}`);
                    log(`Cross Margin Used: ${crossMarginUsed}`);
                    
                    // Check if values are strings vs numbers
                    log('\n🔍 Data Types:');
                    log(`accountValue type: ${typeof accountValue}`);
                    log(`totalRawUsd type: ${typeof totalRawUsd}`);
                    log(`withdrawable type: ${typeof withdrawable}`);
                    
                } else {
                    log('❌ No marginSummary found in response', true);
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, true);
                console.error('Full error:', error);
            }
        }
        
        async function testRawAPI() {
            const privateKey = document.getElementById('privateKey').value;
            
            if (!privateKey) {
                log('❌ Please enter your private key', true);
                return;
            }
            
            try {
                log('🌐 Testing raw API call...');
                
                const wallet = new ethers.Wallet(privateKey);
                
                const response = await fetch('https://api.hyperliquid.xyz/info', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        type: 'clearinghouseState',
                        user: wallet.address
                    })
                });
                
                log(`Response status: ${response.status}`);
                log(`Response headers: ${JSON.stringify([...response.headers.entries()])}`);
                
                const text = await response.text();
                log(`Raw response text: ${text}`);
                
                try {
                    const json = JSON.parse(text);
                    log('✅ Valid JSON response');
                } catch (e) {
                    log('❌ Invalid JSON response', true);
                }
                
            } catch (error) {
                log(`❌ Raw API error: ${error.message}`, true);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Run Tests</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: #fff; }
        .button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🚀 Quick Test Runner</h1>
    <p>Click the button below to run basic tests in this window:</p>
    <button class="button" onclick="runTests()">Run Basic Tests</button>
    <button class="button" onclick="window.open('/test.html', '_blank')">Open Full Test Interface</button>
    
    <div id="results" style="margin-top: 20px; padding: 15px; background: #2a2a2a; border-radius: 4px; font-family: monospace;"></div>    <script>
        // First, let's try to load the service from the main app
        function loadServiceFromMainApp() {
            try {
                // Try to access from parent window or iframe
                if (window.parent && window.parent.hyperliquidService) {
                    return window.parent.hyperliquidService;
                }
                
                // Try to access from opener window
                if (window.opener && window.opener.hyperliquidService) {
                    return window.opener.hyperliquidService;
                }
                
                // Direct access
                if (window.hyperliquidService) {
                    return window.hyperliquidService;
                }
                
                return null;
            } catch (error) {
                console.error('Error accessing service:', error);
                return null;
            }
        }

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const className = type === 'success' ? 'color: #28a745' : type === 'error' ? 'color: #dc3545' : 'color: #fff';
            results.innerHTML += `<div style="${className}">${message}</div>`;
        }

        async function runTests() {
            document.getElementById('results').innerHTML = '';
            log('🚀 Starting Hyperliquid Service Tests...');

            // First, try to get service from various sources
            let service = loadServiceFromMainApp();
            
            if (!service) {
                // Try loading the service module directly
                try {
                    log('🔄 Service not found in window, trying to load module...');
                    
                    // Import the service directly (this might not work due to module loading)
                    log('❌ Unable to load service directly from test page', 'error');
                    log('💡 Solution: Open this test from the main app', 'info');
                    log('📝 Instructions:');
                    log('1. Go to http://localhost:5175/ (main app)');
                    log('2. Open browser console (F12)');
                    log('3. Type: window.open("/quick-test.html")');
                    log('4. Or navigate to /test.html for full interface');
                    return;
                } catch (error) {
                    log(`❌ Module loading failed: ${error.message}`, 'error');
                    return;
                }
            }

            log('✅ Test 1 PASSED: Hyperliquid service is available', 'success');
            
            // Test 2: Connection Status
            log(`🔗 Connection Status: ${service.isWalletConnected() ? 'Connected' : 'Not Connected'}`);
            log(`📍 Wallet Address: ${service.getWalletAddress() || 'None'}`);
            
            // Test 3: Market Data (No auth needed)
            try {
                log('🔄 Test 3: Testing Market Data (no auth required)...');
                const data = await service.getMarketData('ETH');
                log('✅ Test 3 PASSED: Market data retrieved', 'success');
                log(`📊 ETH Price: $${data ? data.price : 'N/A'}`);
            } catch (error) {
                log(`❌ Test 3 FAILED: ${error.message}`, 'error');
            }
            
            // Test 4: Trading Info (No auth needed)
            try {
                log('🔄 Test 4: Testing Trading Info (no auth required)...');
                const info = await service.getTradingInfo('ETH');
                log('✅ Test 4 PASSED: Trading info retrieved', 'success');
                log(`ℹ️ ETH Symbol Info Available: ${info ? 'Yes' : 'No'}`);
            } catch (error) {
                log(`❌ Test 4 FAILED: ${error.message}`, 'error');
            }

            // Test 5: Debug Test
            try {
                log('🔄 Test 5: Running debug test...');
                await service.debugTest();
                log('✅ Test 5 PASSED: Debug test completed', 'success');
            } catch (error) {
                log(`❌ Test 5 FAILED: ${error.message}`, 'error');
            }
            
            log('✅ Basic tests completed!', 'success');
            log('🔑 For authenticated tests, use the full test interface with a wallet connection');
        }

        // Try to load service when page loads
        window.addEventListener('load', () => {
            const service = loadServiceFromMainApp();
            if (service) {
                log('✅ Service detected on page load', 'success');
            } else {
                log('ℹ️ Service not immediately available, use "Run Basic Tests" button', 'info');
            }
        });
    </script>
</body>
</html>
